<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cigarette-smoke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <svg class="ribbon" viewBox="0 -100 1600 440" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- One long wave; all the lyrics ride it back to back. -->
        <path id="wave" d="M0 150 Q200 40 400 150 T800 150 T1200 150 T1600 150 T2000 150 T2400 150 T2800 150 T3200 150 T3600 150 T4000 150 T4400 150 T4800 150 T5200 150 T5600 150 T6000 150 T6400 150 T6800 150 T7200 150 T7600 150 T8000 150 T8400 150 T8800 150 T9200 150 T9600 150 T10000 150 T10400 150 T10800 150 T11200 150 T11600 150 T12000 150 T12400 150 T12800 150 T13200 150 T13600 150 T14000 150 T14400 150 T14800 150 T15200 150 T15600 150 T16000 150"/>
        <!-- Satin ribbon shading: soft lighting across each stroke plus a glossy highlight. -->
        <filter id="satin" x="-2%" y="-20%" width="104%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="bump"/>
          <feDiffuseLighting in="bump" surfaceScale="5" diffuseConstant="1.15" lighting-color="#ffffff" result="diffuse">
            <feDistantLight azimuth="235" elevation="50"/>
          </feDiffuseLighting>
          <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="shaded"/>
          <feSpecularLighting in="bump" surfaceScale="5" specularConstant="0.9" specularExponent="25" lighting-color="#fff4f8" result="gloss">
            <feDistantLight azimuth="235" elevation="50"/>
          </feSpecularLighting>
          <feComposite in="gloss" in2="SourceAlpha" operator="in" result="glossIn"/>
          <feComposite in="shaded" in2="glossIn" operator="arithmetic" k2="1" k3="1" result="lit"/>
          <feComposite in="lit" in2="SourceAlpha" operator="in"/>
        </filter>
      </defs>
      <g class="lyrics">
        <!-- Each <tspan> is one lyric line, in order. After changing
             the lyrics, re-measure the timing in style.css. -->
        <text><textPath href="#wave">
            <tspan>it's bone dry, bitter and hollow, </tspan>
            <tspan>you'll be miiiiles away tomorrow, </tspan>
            <tspan>whyyyyyyyyyy'd iii tryyyyyy aaaaaaat aaaaaaaaaaaaaaaaaaaall?</tspan>
            <tspan>it's bone dry, bitter and hollow,</tspan>
            <tspan>you will neeeever know my sorrow,</tspan>
            <tspan>whyyyyyyyyyy'd iii tryyyyyy aaaaaaat aaaaaaaaaaaaaaaaaaaall?</tspan>
        </textPath></text>
      </g>
    </svg>
  </main>
</body>
</html>
